<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Page not found - Inbox Classic</title>
        <meta name="robots" content="noindex" />
        <meta name="theme-color" content="#4c5cc5" />
        <link rel="icon" href="/favicon.ico" sizes="48x48" />
        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
        <script>
            // apply the stored theme before first paint (js/site.js has the toggle)
            try {
                var inboxclassicTheme = localStorage.getItem('inboxclassicTheme');
                if (inboxclassicTheme === 'light' || inboxclassicTheme === 'dark') {
                    document.documentElement.setAttribute('data-theme', inboxclassicTheme);
                }
            } catch (err) {}
        </script>
        <link href="/fonts/pt-sans-font.css" rel="stylesheet" />
        <link href="/css/app.css" rel="stylesheet" />
    </head>
    <body class="bg-base-200 text-base-content flex min-h-screen flex-col">
        <header class="bg-base-100 border-base-content/20 sticky top-0 z-30 border-b">
            <nav class="max-w-page mx-auto flex w-full items-center gap-2 px-6 py-2" aria-label="Main navigation">
                <a href="/" class="text-base-content flex items-center gap-2 text-lg font-bold">
                    <img src="/favicon.svg" alt="" class="size-7" />
                    Inbox Classic
                </a>
                <ul class="ms-6 hidden items-center gap-1 md:flex">
                    <li><a class="btn btn-text btn-sm" href="/#features">Features</a></li>
                    <li><a class="btn btn-text btn-sm" href="/#agents">AI agents</a></li>
                    <li><a class="btn btn-text btn-sm" href="/#faq">Questions</a></li>
                </ul>
                <div class="ms-auto flex items-center gap-1">
                    <a class="btn btn-text btn-sm" href="https://github.com/postalsys/inbox-classic">
                        <span class="icon-[tabler--brand-github] size-5"></span><span class="hidden sm:inline">GitHub</span>
                    </a>
                    <button type="button" class="theme-toggle-btn btn btn-text btn-circle btn-sm" aria-label="Toggle theme">
                        <span class="theme-toggle-dark icon-[tabler--moon] size-5"></span>
                        <span class="theme-toggle-light icon-[tabler--sun] hidden size-5"></span>
                    </button>
                </div>
            </nav>
        </header>

        <main id="content" class="flex grow flex-col items-center justify-center px-6 py-24 text-center">
            <span class="icon-[tabler--mail-question] text-primary size-14"></span>
            <h1 class="mt-4 text-3xl font-bold">Page not found</h1>
            <p class="text-base-content/70 mt-2 text-lg">There is nothing at this address.</p>
            <a class="btn btn-primary mt-6" href="/"><span class="icon-[tabler--arrow-left] size-5"></span>Go to the Inbox Classic homepage</a>
        </main>

        <footer class="bg-base-100 border-base-content/20 border-t py-6">
            <div class="text-base-content/60 flex flex-wrap items-center justify-center gap-x-4 gap-y-1 px-6 text-center text-sm">
                <span>&copy; 2026 Postal Systems O&Uuml;</span>
                <a class="link link-animated" href="/privacy">Privacy</a>
                <a class="link link-animated" href="/terms">Terms</a>
                <a class="link link-animated" href="https://github.com/postalsys/inbox-classic">GitHub</a>
            </div>
            <div class="text-base-content/60 mt-3 flex flex-wrap items-center justify-center gap-x-2 gap-y-1 px-6 text-center text-sm">
                <span>From the makers of</span>
                <a
                    class="inline-flex rounded-md bg-white px-2 py-1"
                    href="https://emailengine.app/?utm_source=inboxclassic.com&utm_medium=footer&utm_campaign=oss-docs"
                    ><img src="/img/emailengine.png" alt="EmailEngine" width="97" height="20" class="h-5 w-auto"
                /></a>
            </div>
        </footer>

        <script src="/js/site.js"></script>
    </body>
</html>
